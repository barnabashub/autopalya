<body>
  <div class="app">
    <aside class="panel">
      <header class="top">
        <h1 class="brand"><span class="plate" aria-hidden="true">M</span><span data-i18n="title">Matricatérkép</span></h1>
        <label class="lang">
          <span class="sr-only">Language</span>
          <select id="lang"></select>
        </label>
      </header>

      <div class="tabs" role="tablist">
        <button role="tab" id="t-route" aria-controls="p-route" aria-selected="true" data-i18n="tab.route">Útvonal</button>
        <button role="tab" id="t-prices" aria-controls="p-prices" aria-selected="false" tabindex="-1" data-i18n="tab.prices">Árak</button>
        <button role="tab" id="t-guide" aria-controls="p-guide" aria-selected="false" tabindex="-1" data-i18n="tab.guide">Tudnivalók</button>
      </div>

      <section class="tabpanel" id="p-route" role="tabpanel" aria-labelledby="t-route">
        <form class="plan" id="plan" autocomplete="off">
          <div class="ends">
            <div class="field" data-end="from">
              <label for="from-input" data-i18n="from">Honnan</label>
              <div class="input-row">
                <span class="dot dot-a" aria-hidden="true">A</span>
                <input id="from-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="from-list" spellcheck="false" enterkeyhint="search">
                <button type="button" class="icon clear" data-i18n-title="clear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                <button type="button" class="icon locate" data-i18n-title="useLocation"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
              </div>
              <ul class="suggest" id="from-list" role="listbox" hidden></ul>
            </div>
            <button type="button" class="swap" id="swap" data-i18n-title="swap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M8 20l-4-4M8 20l4-4M16 20V4M16 4l-4 4M16 4l4 4"/></svg></button>
            <div class="field" data-end="to">
              <label for="to-input" data-i18n="to">Hová</label>
              <div class="input-row">
                <span class="dot dot-b" aria-hidden="true">B</span>
                <input id="to-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="to-list" spellcheck="false" enterkeyhint="search">
                <button type="button" class="icon clear" data-i18n-title="clear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                <button type="button" class="icon locate" data-i18n-title="useLocation"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
              </div>
              <ul class="suggest" id="to-list" role="listbox" hidden></ul>
            </div>
          </div>
          <p class="hint" data-i18n="pickHint">Pontot a térképre koppintva is választhatsz.</p>

          <fieldset class="vehicle">
            <legend data-i18n="vehicle">Jármű</legend>
            <div class="seg">
              <label><input type="radio" name="cat" value="D1" checked><span><b data-i18n="cat.D1">Személyautó</b><small data-i18n="cat.D1.sub"></small></span></label>
              <label><input type="radio" name="cat" value="D1M"><span><b data-i18n="cat.D1M">Motor</b><small data-i18n="cat.D1M.sub"></small></span></label>
              <label><input type="radio" name="cat" value="D2"><span><b data-i18n="cat.D2">Kisbusz, kisteherautó, lakóautó</b><small data-i18n="cat.D2.sub"></small></span></label>
            </div>
            <label class="check" id="trailer-wrap" hidden><input type="checkbox" id="trailer"> <span data-i18n="trailer">Utánfutóval (U)</span></label>
          </fieldset>
        </form>

        <div id="result" class="result" aria-live="polite"></div>
      </section>

      <section class="tabpanel" id="p-prices" role="tabpanel" aria-labelledby="t-prices" hidden></section>
      <section class="tabpanel prose" id="p-guide" role="tabpanel" aria-labelledby="t-guide" hidden></section>
    </aside>

    <main class="mapwrap">
      <div id="map" role="application" aria-label="Map"></div>
      <div class="legend" id="legend"></div>
    </main>
  </div>
  <noscript><p style="padding:16px">Ehhez az oldalhoz JavaScript szükséges: az autópálya-matrica kalkulátor és a megyei matrica térkép csak bekapcsolt JavaScripttel működik. This Hungary vignette checker needs JavaScript.</p></noscript>
